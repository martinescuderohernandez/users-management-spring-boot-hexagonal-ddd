# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource se configura manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# =============================================
# Kafka — Aiven (Producer)
# =============================================
kafka.bootstrap-servers=${KAFKA_SERVICE_URI:kafka-11a18fa7-tercer-corte-electiva.d.aivencloud.com:27108}
kafka.topic.users=users-topic
kafka.producer.client-id=users-management-service

# SSL — certificados en src/main/resources (classpath)
kafka.ssl.truststore.location=${KAFKA_TRUSTSTORE_LOCATION:classpath:truststore.p12}
kafka.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
kafka.ssl.truststore.type=PKCS12
kafka.ssl.keystore.location=${KAFKA_KEYSTORE_LOCATION:classpath:keystore.p12}
kafka.ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
kafka.ssl.keystore.type=PKCS12
kafka.ssl.key.password=${KAFKA_KEY_PASSWORD}