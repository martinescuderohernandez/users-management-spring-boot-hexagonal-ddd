services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: crud_usuarios
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
      - key: ACCOUNT_SERVICE_URL
        sync: false
      - key: KAFKA_SERVICE_URI
        sync: false
      - key: KAFKA_TRUSTSTORE_BASE64
        sync: false
      - key: KAFKA_KEYSTORE_BASE64
        sync: false
      - key: KAFKA_TRUSTSTORE_LOCATION
        value: "file:/etc/secrets/truststore.p12"
      - key: KAFKA_TRUSTSTORE_PASSWORD
        sync: false
      - key: KAFKA_KEYSTORE_LOCATION
        value: "file:/etc/secrets/keystore.p12"
      - key: KAFKA_KEYSTORE_PASSWORD
        sync: false
      - key: KAFKA_KEY_PASSWORD
        sync: false
